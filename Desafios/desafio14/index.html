<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 8px;
        }
        thead{
            background-color: #2c2c2c;
            color: white;
        }
        td.num{
            text-align: center;
        }
        tr.media{
            font-weight: bold;
            background-color: rgb(56, 56, 56);
            color: white;
            text-align: left;
        }
        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="rowgroup">Área</th>
                <th rowspan="2" scope="rowgroup">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="rowgroup">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
                
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="num">5.5</td>
                <td class="num">6.5</td>
                <td class="num">6</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">7</td>
                <td class="num">8</td>
                <td class="num">7.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">6</td>
                <td class="num">7</td>
                <td class="num">6.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">8</td>
                <td class="num">9</td>
                <td class="num">8.5</td>
            </tr>
            <tr class="media">
                <th colspan="4" scope="row">Média de Exatas</th>
                <td class="num">00</td>
            </tr>
             <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="num">5.5</td>
                <td class="num">6.5</td>
                <td class="num">6</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">7</td>
                <td class="num">8</td>
                <td class="num">7.5</td>
            </tr>
             <tr class="media">
                <th colspan="4" scope="row">Média de Humanas</th>
                <td class="num">00</td>
            </tr>
            

        </tbody>
        <tfoot>

        </tfoot>
    </table>
    
</body>
</html>
