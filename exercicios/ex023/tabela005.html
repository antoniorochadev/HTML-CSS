<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{
            font-size:1.3em;
            font-weight: bold;
            padding:8px;
        }
        td, th{
            border: 1px solid black;
            padding: 8px;
        }
        col.cnome{
            background-color: aqua;
        }
        col.cprof{
            background-color: lightgreen;
        }
        col.cgrupo{
            background-color: rgb(255, 238, 2);
        }
    </style>
</head>
<body>
    <h1>Exercício de tabelas</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana MAria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>30</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Carla Souza</td>
            <td>F</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Rafael Lima</td>
            <td>M</td>
            <td>35</td>
            <td>Engenheiro</td>
        </tr>    
        <tr>
                <td>Mariana Alves</td>
                <td>F</td>
                <td>22</td>
                <td>Estudante</td>
        </tr>
        <tr>
                <td>Lucas Fernandes</td>
                <td>M</td>
                <td>27</td>
                <td>Advogado</td>
        </tr>
    </table>
    
</body>
</html>
