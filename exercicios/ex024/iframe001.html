<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eestudos de Iframes</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 
        <!-- Tamanho padrão do iframe 300x150px-->
        <iframe src="http://cursoemvideo.com" frameborder="0" scrolling="no">
            <a href="http://cursoemvideo.com" target="_blank">Cruso em Vídeo</a>
        </iframe>
     para aprender a programar
    </p>

    <p>
        O repositórios Guanabara 

        <iframe src="http://gustavoguanabara.github.io" frameborder="0">
            <a href="http://gustavoguanabara.github.io" target="_blank">no Guithub</a>
        </iframe>

        também é bem legal!
    </p>
</body>
</html>
